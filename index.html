  .c7{ width:50vw; height:50vw; top:10vh; left:-40vw; animation: moveL 1s ease-out forwards; animation-delay:.1s; }

      document.execCommand('copy');

      tempInput.remove();

    }

  });

});

<script>
const weddingDate = new Date('2026-09-15T15:00:00+05:00').getTime();

function updateCountdown(){

  const now = new Date().getTime();
  const difference = weddingDate - now;

  if(difference <= 0){

    document.getElementById('days').textContent = '00';
    document.getElementById('hours').textContent = '00';
    document.getElementById('minutes').textContent = '00';
    document.getElementById('seconds').textContent = '00';

    return;
  }

  const days = Math.floor(
    difference / (1000 * 60 * 60 * 24)
  );

  const hours = Math.floor(
    (difference / (1000 * 60 * 60)) % 24
  );

  const minutes = Math.floor(
    (difference / (1000 * 60)) % 60
  );

  const seconds = Math.floor(
    (difference / 1000) % 60
  );

  document.getElementById('days').textContent =
    String(days).padStart(2,'0');

  document.getElementById('hours').textContent =
    String(hours).padStart(2,'0');

  document.getElementById('minutes').textContent =
    String(minutes).padStart(2,'0');

  document.getElementById('seconds').textContent =
    String(seconds).padStart(2,'0');
}

updateCountdown();

setInterval(updateCountdown,1000);
</script>

<script>
(function () {

  const music = document.getElementById('weddingMusic');

  if (!music) return;

  music.volume = 1;
  let started = false;

  function startMusic() {
    if (started) return;
    const promise = music.play();

    if (promise !== undefined) {
      promise.then(function () {
        started = true;
      }).catch(function (error) {
        console.log('Autoplay blocked by browser:', error);
      });
    }
  }

  // Пытаемся сразу — сработает в части браузеров
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startMusic);
  } else {
    startMusic();
  }
  window.addEventListener('load', startMusic);

  // Фолбэк: если браузер заблокировал автоплей (чаще всего iPhone/Safari),
  // музыка запустится сама при первом же касании/клике/скролле,
  // без отдельной кнопки, незаметно для пользователя
  const fallbackEvents = ['touchstart', 'click', 'scroll', 'keydown'];
  fallbackEvents.forEach(function (evt) {
    document.addEventListener(evt, function onceHandler() {
      startMusic();
      fallbackEvents.forEach(function (e) {
        document.removeEventListener(e, onceHandler);
      });
    }, { once: true, passive: true });
  });

})();
</script>
<script>
const music = document.getElementById('weddingMusic');
const soundButton = document.getElementById('soundButton');

if (music) {
  music.volume = 1;

  window.addEventListener('load', () => {
    music.play().catch(() => {});
  });
}

/* КНОПКА ЗВУКА */
if (soundButton && music) {

  soundButton.addEventListener('click', function (event) {

    event.stopPropagation();

    if (music.muted || music.paused) {

      music.muted = false;

      music.play().catch(() => {});

    } else {

      music.muted = true;

    }

  });

}
</script>
